version: '3.8'

services:
  verity-gateway:
    build: .
    container_name: verity_sentinel_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - VERITY_HOST=0.0.0.0
      - VERITY_PORT=8080
      - VERITY_ADMIN_PIN=1234
      - VERITY_DEBUG=False
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
